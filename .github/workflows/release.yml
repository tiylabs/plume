name: Release

on:
  push:
    tags:
      - "v*"
  # The prerelease is promoted to a full release by hand after review ("Set as the latest release");
  # `released` fires on that promotion, which is the moment the Homebrew cask is bumped.
  release:
    types: [released]

# The tag is the trigger, and the smoke test is the gate before it — see the release process in
# CLAUDE.md. Nothing here replaces running the real app by hand first; this exists so the artifact
# people download is built from a clean checkout rather than from whatever was in a working tree.
permissions:
  contents: write

jobs:
  # PlumeKit (Swift) and the editor (node + the WKWebView probe) share nothing, so they are separate
  # jobs and run alongside each other and the builds.
  test-kit:
    if: github.event_name == 'push'
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - name: Test PlumeKit
        run: Scripts/test-all.sh --only kit

  test-editor:
    if: github.event_name == 'push'
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: Editor/package-lock.json

      - name: Install editor dependencies
        run: npm ci --no-audit --no-fund
        working-directory: Editor

      # The same suites as CI, from the same script. The tag is the moment with the least room for
      # "we'll catch it next time", and this workflow used to run the Foundation suite alone — so a
      # tag pushed from a tree CI had never seen shipped with 429 assertions unrun. The script also
      # builds the editor bundle that is uploaded below.
      - name: Test the editor
        run: Scripts/test-all.sh --only web

      - name: Upload the tested editor bundle
        uses: actions/upload-artifact@v4
        with:
          name: plume-editor
          path: Editor/dist/
          if-no-files-found: error
          retention-days: 1

  # Each architecture gets its own runner and SwiftPM build directory. Both test jobs run alongside them;
  # only the final job needs all of them to succeed before signing and publishing anything.
  build:
    if: github.event_name == 'push'
    runs-on: macos-latest
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        arch: [arm64, x86_64]
    steps:
      - uses: actions/checkout@v5

      - name: Build Plume (${{ matrix.arch }})
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          swift build -c release --arch "$ARCH" --product Plume
          BIN="$(swift build -c release --arch "$ARCH" --product Plume --show-bin-path)/Plume"
          lipo "$BIN" -verify_arch "$ARCH"
          mkdir -p "build/$ARCH"
          cp "$BIN" "build/$ARCH/Plume"

      - name: Upload the architecture binary
        uses: actions/upload-artifact@v4
        with:
          name: plume-${{ matrix.arch }}
          path: build/${{ matrix.arch }}/Plume
          if-no-files-found: error
          retention-days: 1

  release:
    if: github.event_name == 'push'
    needs: [test-kit, test-editor, build]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # Release notes are the commits since the previous stable tag, so the tag history is needed.
          fetch-depth: 0

      - name: Download the tested editor bundle
        uses: actions/download-artifact@v4
        with:
          name: plume-editor
          path: Editor/dist

      - name: Download the arm64 binary
        uses: actions/download-artifact@v4
        with:
          name: plume-arm64
          path: build/arm64

      - name: Download the x86_64 binary
        uses: actions/download-artifact@v4
        with:
          name: plume-x86_64
          path: build/x86_64

      - name: Merge the universal binary
        run: |
          set -euo pipefail
          lipo -create build/arm64/Plume build/x86_64/Plume -output build/Plume
          lipo build/Plume -verify_arch arm64
          lipo build/Plume -verify_arch x86_64
          # Artifact downloads do not preserve executable permissions.
          chmod +x build/Plume

      - name: Version from the tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # The certificate lives in a throwaway keychain that exists only for this job. Everything
      # below fails closed: a release that cannot be signed must not fall back to the ad-hoc
      # signature and ship, which is what an unset PLUME_SIGN_IDENTITY would otherwise do.
      - name: Import the Developer ID certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          set -euo pipefail
          for v in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_TEAM_ID APPLE_ID APPLE_APP_SPECIFIC_PASSWORD; do
            if [ -z "${!v:-}" ]; then
              echo "::error::Missing secret $v — signing and notarization need all five."
              exit 1
            fi
          done

          CERT_PATH="$RUNNER_TEMP/signing-certificate.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/plume-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "::add-mask::$KEYCHAIN_PASSWORD"

          echo "$APPLE_CERTIFICATE" | base64 --decode > "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          # -T rather than -A: only codesign and security may use the key, not every program.
          security import "$CERT_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -f pkcs12 \
            -T /usr/bin/codesign -T /usr/bin/security -k "$KEYCHAIN_PATH"
          rm -f "$CERT_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | sed 's/"//g')
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" >/dev/null

          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" \
            | grep 'Developer ID Application:' | grep -F "($APPLE_TEAM_ID)" | head -n 1 \
            | awk -F '"' '{print $2}' || true)"
          if [ -z "$IDENTITY" ]; then
            echo "::error::No 'Developer ID Application' identity for team $APPLE_TEAM_ID in the imported certificate."
            exit 1
          fi
          echo "Signing identity: $IDENTITY"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          echo "PLUME_SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"

      - name: Assemble Plume.app (universal, Developer ID signed)
        env:
          PLUME_VERSION: ${{ steps.version.outputs.version }}
        run: Scripts/build-app.sh --skip-editor --binary build/Plume

      # Notarize the app before it goes into the image, so the ticket is stapled to the bundle the
      # user drags out and it opens offline. The image is notarized again below.
      - name: Notarize Plume.app
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: Scripts/notarize.sh build/Plume.app

      - name: Package
        id: package
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          Scripts/make-dmg.sh
          NAME="Plume-${{ steps.version.outputs.version }}.dmg"
          test -f "build/$NAME"
          codesign --force --timestamp --sign "$PLUME_SIGN_IDENTITY" "build/$NAME"
          codesign --verify --verbose=2 "build/$NAME"
          Scripts/notarize.sh "build/$NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "sha256=$(shasum -a 256 "build/$NAME" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Verify the packaged app
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          # Verify what people actually download — the app as it sits on the mounted image, not the
          # build directory it was copied from. A packaging step that corrupts the bundle would pass
          # every check made before it.
          hdiutil attach "build/${{ steps.package.outputs.name }}" -nobrowse -readonly -mountpoint /tmp/verify
          trap 'hdiutil detach /tmp/verify -quiet || true' EXIT

          codesign --verify --deep --strict /tmp/verify/Plume.app
          # Signed by a Developer ID with the hardened runtime — not the ad-hoc fallback, which
          # passes `--verify` just as happily.
          SIGINFO="$(codesign -dvv /tmp/verify/Plume.app 2>&1)"
          echo "$SIGINFO"
          grep -q "Authority=Developer ID Application" <<<"$SIGINFO"
          grep -q "TeamIdentifier=$APPLE_TEAM_ID" <<<"$SIGINFO"
          grep -Eq "flags=0x[0-9a-f]+\(.*runtime" <<<"$SIGINFO"
          test "$(plutil -extract CFBundleIdentifier raw /tmp/verify/Plume.app/Contents/Info.plist)" = "com.tiylabs.plume"
          # What Gatekeeper itself says, for the app and for the image, and that the ticket is
          # stapled so the first launch does not need the network.
          xcrun stapler validate /tmp/verify/Plume.app
          spctl --assess --type execute --verbose=4 /tmp/verify/Plume.app
          xcrun stapler validate "build/${{ steps.package.outputs.name }}"
          spctl --assess --type open --context context:primary-signature --verbose=4 "build/${{ steps.package.outputs.name }}"
          # Universal, or the release silently drops every Intel Mac.
          lipo -archs /tmp/verify/Plume.app/Contents/MacOS/Plume | tee /dev/stderr | grep -q "x86_64"
          lipo -archs /tmp/verify/Plume.app/Contents/MacOS/Plume | grep -q "arm64"
          test "$(plutil -extract CFBundleShortVersionString raw /tmp/verify/Plume.app/Contents/Info.plist)" \
            = "${{ steps.version.outputs.version }}"
          # The alias is the whole reason this is an image rather than a zip.
          test "$(readlink /tmp/verify/Applications)" = "/Applications"

      # The notes are the commits between this tag and the previous *stable* tag (vX.Y.Z, no -rc
      # suffix). A release candidate therefore lists everything since the last stable release, not
      # just what changed since the previous candidate.
      - name: Find the previous stable tag
        id: prev_tag
        run: |
          set -euo pipefail
          # versionsort.suffix makes `v0.2.1075-rc.1` sort *before* `v0.2.1075`, as git would not by
          # default. Walk the tags oldest to newest and keep the last stable one seen before this tag.
          PREV_TAG=""
          while IFS= read -r t; do
            if [ "$t" = "$GITHUB_REF_NAME" ]; then break; fi
            if printf '%s' "$t" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then PREV_TAG="$t"; fi
          done < <(git -c versionsort.suffix=-rc tag -l --sort=v:refname)
          echo "prev_tag=${PREV_TAG}" >> "$GITHUB_OUTPUT"
          echo "Current tag: ${GITHUB_REF_NAME}, previous stable tag: ${PREV_TAG:-<none>}"

      - name: Generate the release notes
        id: changelog
        if: steps.prev_tag.outputs.prev_tag != ''
        uses: requarks/changelog-action@v1.10.3
        with:
          token: ${{ github.token }}
          fromTag: ${{ github.ref_name }}
          toTag: ${{ steps.prev_tag.outputs.prev_tag }}
          writeToFile: false

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          # Passed through the environment, never interpolated into the script: it is commit text.
          NOTES: ${{ steps.changelog.outputs.changes }}
          PREV_TAG: ${{ steps.prev_tag.outputs.prev_tag }}
        run: |
          set -euo pipefail
          if [ -n "$PREV_TAG" ] && [ -n "$NOTES" ]; then
            printf '%s\n' "$NOTES" > "$RUNNER_TEMP/release-notes.md"
            NOTES_ARGS=(--notes-file "$RUNNER_TEMP/release-notes.md")
          else
            # No earlier stable tag (the very first release) — let GitHub write the notes.
            NOTES_ARGS=(--generate-notes)
          fi
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            "${NOTES_ARGS[@]}" \
            --prerelease \
            "build/${{ steps.package.outputs.name }}"

          # The sha256 the Homebrew cask needs, in the job log rather than only in the artifact —
          # bumping the cask is the next manual step and this saves re-downloading to compute it.
          echo "::notice title=Cask sha256::${{ steps.package.outputs.sha256 }}"

      - name: Summary
        run: |
          {
            echo "### Plume ${{ steps.version.outputs.version }}"
            echo
            echo "Release created **as a prerelease** — review the notes, then promote it to a full release."
            echo
            echo '```'
            echo "asset:  ${{ steps.package.outputs.name }}"
            echo "sha256: ${{ steps.package.outputs.sha256 }}"
            echo '```'
            echo
            echo "Signed with Developer ID and notarized. Promoting the prerelease bumps"
            echo "\`Casks/plume.rb\` in \`tiylabs/homebrew-tap\` automatically."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove the signing keychain
        if: always()
        run: |
          if [ -n "${KEYCHAIN_PATH:-}" ]; then
            security delete-keychain "$KEYCHAIN_PATH" || true
          fi
          rm -f "$RUNNER_TEMP/signing-certificate.p12"

  # Runs when the prerelease is promoted to a full release, from the asset people actually download, so the sha256 in the
  # cask is the one of the published bytes.
  update-homebrew:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Resolve the version and the image checksum
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          DMG="Plume-${VERSION}.dmg"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "$DMG" --dir .
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "SHA256=$(sha256sum "$DMG" | awk '{print $1}')" >> "$GITHUB_ENV"

      - name: Render the cask
        run: |
          set -euo pipefail
          sed -E \
            -e "s/^(  version )\".*\"/\1\"$VERSION\"/" \
            -e "s/^(  sha256 )\".*\"/\1\"$SHA256\"/" \
            packaging/plume.rb > plume.rb
          grep -q "version \"$VERSION\"" plume.rb
          grep -q "sha256 \"$SHA256\"" plume.rb

      - name: Push to tiylabs/homebrew-tap
        env:
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$PAT_TOKEN" ]; then
            echo "::error::Missing secret PAT_TOKEN (needs write access to tiylabs/homebrew-tap)."
            exit 1
          fi
          git clone --depth 1 "https://x-access-token:${PAT_TOKEN}@github.com/tiylabs/homebrew-tap.git" tap
          mkdir -p tap/Casks
          cp plume.rb tap/Casks/plume.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/plume.rb
          if git diff --cached --quiet; then
            echo "Cask already up to date."
            exit 0
          fi
          git commit -m "Update Plume to $VERSION"
          git push
