name: CI

# Every branch, and pull requests. Work happens on topic branches and reaches `master` through a
# pull request, so a trigger on `master` alone would gate nothing — a topic branch has to be green
# before it is merged. See "Branching and commits" in AGENTS.md.
on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  # Cheap and runs on Linux, so a bad message fails in seconds instead of after the macOS build.
  # Only the commits this push or pull request adds are checked; older history is left alone.
  commit-message:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Check commit messages
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "pull_request" ]; then
            Scripts/check-commit-msg.sh "$PR_BASE" "$PR_HEAD"
          elif [ "$PUSH_BEFORE" != "0000000000000000000000000000000000000000" ] \
               && git cat-file -e "${PUSH_BEFORE}^{commit}" 2>/dev/null; then
            Scripts/check-commit-msg.sh "$PUSH_BEFORE" "$PUSH_AFTER"
          else
            # A new branch, or a force-push that dropped the old tip: there is no usable range, so
            # check the tip commit only.
            Scripts/check-commit-msg.sh "$PUSH_AFTER"
          fi

  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: Editor/package-lock.json

      - name: Install editor dependencies
        run: npm ci --no-audit --no-fund
        working-directory: Editor

      # Every suite in one script — PlumeKit, the editor typecheck, the keyboard tables, and the
      # WKWebView suites (a real WKWebView in a real NSWindow, which catch what reading the code
      # cannot: a decoration in the wrong place, a panel that resizes the window as you filter it).
      # The list of suites lives in Scripts/test-all.sh and nowhere else.
      #
      # `swift test` cannot run here: neither XCTest nor swift-testing ships with the Command Line
      # Tools. The PlumeKit suite is an ordinary executable target, runnable wherever `swift build` is.
      - name: Test everything
        run: Scripts/test-all.sh

      # Errors fail the build (the length ratchet in .swiftlint.yml); the handful of warnings the
      # code already had do not.
      # Comments may not cite documents this repository does not contain; the count only goes down.
      - name: Check references to unpublished documents
        run: Scripts/check-doc-refs.sh

      # Pinned: a rule added by a newer SwiftLint must not turn an unrelated push red. Bump the
      # version here and in .swiftlint.yml together, after checking the new rules against the tree.
      # Not `--strict`: that would promote the warning thresholds (the targets) to failures.
      - name: Lint Swift
        env:
          SWIFTLINT_VERSION: 0.63.2
        run: |
          curl -fsSL -o swiftlint.zip \
            "https://github.com/realm/SwiftLint/releases/download/${SWIFTLINT_VERSION}/portable_swiftlint.zip"
          unzip -q swiftlint.zip -d "$RUNNER_TEMP/swiftlint"
          "$RUNNER_TEMP/swiftlint/swiftlint" version
          "$RUNNER_TEMP/swiftlint/swiftlint" lint --quiet

      # Assembles the real .app, so a break in the bundling script, the Info.plist substitution or
      # the ad-hoc signature fails the build rather than waiting for a release.
      - name: Build Plume.app
        run: Scripts/build-app.sh

      - name: Verify the bundle
        run: |
          set -euo pipefail
          APP=build/Plume.app
          test -x "$APP/Contents/MacOS/Plume"
          test "$(plutil -extract CFBundleIdentifier raw "$APP/Contents/Info.plist")" = "com.tiylabs.plume"
          test -f "$APP/Contents/Resources/Editor/index.html"
          test -f "$APP/Contents/Resources/AppIcon.icns"
          test -f "$APP/Contents/Resources/MenuBar@2x.png"
          codesign --verify --deep --strict "$APP"

          # Plume requests no privacy permissions at all, and the build can keep that promise on
          # its own: an NS*UsageDescription key appearing in the bundle means one of them broke.
          # Cheaper to catch here than in a review.
          if plutil -p "$APP/Contents/Info.plist" | grep -q "UsageDescription"; then
            echo "error: Info.plist declares a privacy usage description" >&2
            exit 1
          fi

          # And the development channel the same way. A release bundle carrying PlumeScratchBuild
          # would resolve its Application Support to "Plume (Debug)" and default its vault to a
          # development folder, so
          # every installer would open an empty folder on first run and their notes would look gone.
          # This step builds with the release default, so the key must be absent.
          if plutil -p "$APP/Contents/Info.plist" | grep -q "PlumeScratchBuild"; then
            echo "error: a release bundle is stamped as a scratch build" >&2
            exit 1
          fi

      - name: Verify development isolation
        run: |
          Scripts/build-app.sh --debug --skip-editor
          Scripts/test-dev-isolation.sh
